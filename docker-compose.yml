services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: samarthya-backend
    restart: unless-stopped
    env_file:
      - ./backend/config.env
    ports:
      - "5173:5173"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: samarthya-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:5173
    env_file:
      - ./backend/config.env
    ports:
      - "8005:8005"
    depends_on:
      - backend

volumes:
  backend_uploads:
